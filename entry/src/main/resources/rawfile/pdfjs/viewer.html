<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    CSP：这个页面只做一件事（把 PDF 文本连同坐标吐回 ArkTS），不需要联网、不需要加载外部资源。
    `unsafe-eval` 是 pdf.js 3.x 的字体/CMap 解析要用的（`isEvalSupported:false` 已经关掉了
    它那条 eval 路径，这里保留是为了不改变已验证过的行为）。
    不写 CSP 的话，一旦 rawfile 被换掉/被注入，页面就能任意加载外部脚本 —— 威胁很弱，但不是零。
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; connect-src data: blob:; worker-src 'self' blob:; font-src data: blob:;" />
  <title>pdf.js worker page</title>
  <style>
    html, body { margin: 0; padding: 0; background: #fff; font: 12px sans-serif; }
    #log { padding: 6px; color: #666; }
  </style>
</head>
<body>
<div id="log">pdf.js 未开始</div>
<script src="pdf.min.js"></script>
<script src="cmaps-data.js"></script>
<script>
  /*
   * 这个页面只干一件事：把 PDF 的**带坐标文本片段**抽出来，回传 ArkTS。
   *
   * 为什么走 ArkWeb 而不是 PDF Kit：PDF Kit 的 getTextContent() 只给纯字符串（没有坐标），
   * 而课表解析必须知道"这串字落在星期几那一列"（见 docs/SPIKES.md）。
   * pdf.js 的 textContent.items 带 transform 矩阵，坐标齐全。
   *
   * 回传格式刻意用**制表符分隔的纯文本**而不是 JSON：
   * ArkTS 的 JSON.parse 返回 Object，逐字段取要一堆断言；纯文本 split 就够，也不会因为
   * 某个字段是数字/字符串而踩类型。
   *
   *   OK\n
   *   page\tx\ty\tendX\tfontSize\ttext\n     （x 向右、y 向下，单位都是 PDF point）
   *   END
   * 或
   *   ERR\t<message>\nEND
   */
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

  function log(msg) {
    document.getElementById('log').textContent = msg;
  }

  function base64ToBytes(b64) {
    const bin = atob(b64);
    const len = bin.length;
    const out = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      out[i] = bin.charCodeAt(i);
    }
    return out;
  }

  /*
   * CMap 供给器：从内联的 `window.__CMAPS`（cmaps-data.js）取字节，**不发任何请求**。
   * 为什么不用 cMapUrl：ArkWeb 里 `resource://rawfile` 上 XHR 被 CORS 拦掉
   * （控制台原文："Cross origin requests are only supported for protocol schemes:
   * arkweb, arkweb-extension, chrome, ..."），pdf.js 于是报
   * "Unable to load binary CMap" 并把整页文字丢掉。
   */
  class InlineCMapReaderFactory {
    constructor(params) {
      this.baseUrl = (params && params.baseUrl) || '';
      this.isCompressed = !!(params && params.isCompressed);
    }
    fetch(params) {
      const name = params.name;
      const b64 = window.__CMAPS ? window.__CMAPS[name] : null;
      if (!b64) {
        return Promise.reject(new Error('内置 CMap 里没有 ' + name));
      }
      return Promise.resolve({
        cMapData: base64ToBytes(b64),
        compressionType: this.isCompressed ? 1 : 0,
      });
    }
  }

  /*
   * 结果放在全局变量里**等 ArkTS 来轮询**，主通道不是 registerJavaScriptProxy。
   *
   * 原因：`registerJavaScriptProxy` 必须在页面加载后 `refresh()` 才对当前页生效；
   * 而 Web 组件是"点了导入才创建"的 —— 创建/注册/重载三者时序一旦错开，
   * JS 里的 `window.pdfBridge` 就是 undefined，解析结果**静默丢失**
   * （实测表现：一直卡在"解析中…"）。轮询没有这个时序问题。
   */
  window.__pdfResult = '';
  window.__pdfError = '';

  function send(payload) {
    // 代理通道保留作备用，但 ArkTS 侧以 __pdfResult 为准
    if (window.pdfBridge && typeof window.pdfBridge.report === 'function') {
      try {
        window.pdfBridge.report(payload);
      } catch (e) {
        // 忽略：主通道是 __pdfResult
      }
    }
  }

  async function extractAll(base64) {
    const data = base64ToBytes(base64);
    /*
     * cMapUrl / cMapPacked 是**必须**的：真实课表 PDF 用的是
     * `/Type0 /Encoding UniGB-UCS2-H`（Adobe-GB1 中文字体）且**没有 ToUnicode**，
     * 这时 pdf.js 必须去加载预定义 CMap 才能把字形码翻成汉字；
     * 不配这两个参数，它会把整页文字**整个丢掉** —— 实测真实文件得到 "2 页 / 0 个文本项"。
     * cmaps/ 目录里只放了 GB 系列（约 136KB），没有全量 2MB。
     */
    let doc = null;
    try {
      doc = await pdfjsLib.getDocument({
        data: data,
        cMapUrl: 'cmaps/',
        cMapPacked: true,
        CMapReaderFactory: InlineCMapReaderFactory,
        isEvalSupported: false,
      }).promise;
      const lines = ['OK'];
      let totalItems = 0;
      let emptyItems = 0;
      for (let p = 1; p <= doc.numPages; p++) {
        const page = await doc.getPage(p);
        const viewport = page.getViewport({ scale: 1 });
        const content = await page.getTextContent();
        for (const item of content.items) {
          totalItems++;
          // 只有带 str 的才是文本项（markContent 之类的标记项没有 str）
          if (typeof item.str !== 'string' || item.str.length === 0) {
            emptyItems++;
            continue;
          }
          // 用 viewport 的变换把文本空间坐标映射到"左上原点、y 向下"的页面坐标，
          // 与 logic/PdfModels.ts 的 PdfTextRun 约定一致
          const m = pdfjsLib.Util.transform(viewport.transform, item.transform);
          const x = m[4];
          const y = m[5];
          const fontSize = Math.hypot(m[2], m[3]);
          const endX = x + (item.width || 0);
          lines.push(
            p + '\t' + x.toFixed(2) + '\t' + y.toFixed(2) + '\t' + endX.toFixed(2) + '\t' +
            fontSize.toFixed(2) + '\t' + item.str.replace(/[\t\r\n]/g, ' ')
          );
        }
        page.cleanup();
      }
      return {
        lines: lines,
        numPages: doc.numPages,
        totalItems: totalItems,
        emptyItems: emptyItems,
      };
    } finally {
      /*
       * 必须放 finally：`getDocument` 成功之后，`getPage`/`getTextContent` 抛错时
       * （加密 PDF、损坏的页面树）以前会**漏掉 destroy** —— worker 里的文档对象与
       * 解析出来的字体缓存都留着，导入几次之后内存只涨不降。
       * destroy 自己失败不能再往外抛：会把真正的解析错误盖掉。
       */
      if (doc !== null) {
        try {
          await doc.destroy();
        } catch (e2) {
          log('释放文档失败：' + String(e2));
        }
      }
    }
  }

  // ArkTS 调这个函数开始解析
  window.__runExtract = function (base64) {
    window.__pdfResult = '';
    window.__pdfError = '';
    log('解析中…');
    extractAll(base64).then(function (r) {
      log('完成：' + r.numPages + ' 页 / ' + (r.lines.length - 1) + ' 个文本片段');
      let payload = '';
      if (r.lines.length === 1) {
        // 一个可读片段都没有：把"有多少文本项、其中多少是空串"报出去，
        // 这能区分"PDF 里没有文字"和"有文字但字体没有 Unicode 映射（取不出可读字符）"
        payload = 'ERR\t没有可读文本：' + r.numPages + ' 页 / ' + r.totalItems +
          ' 个文本项，其中 ' + r.emptyItems + ' 个取不出字符（多为 CID 字体缺 ToUnicode 映射）\nEND';
      } else {
        r.lines.push('END');
        payload = r.lines.join('\n');
      }
      window.__pdfResult = payload;
      send(payload);
    }).catch(function (e) {
      const msg = String(e && e.message ? e.message : e);
      log('失败：' + msg);
      const payload = 'ERR\t' + msg.replace(/[\t\r\n]/g, ' ') + '\nEND';
      window.__pdfError = payload;
      send(payload);
    });
  };

  log('pdf.js ' + pdfjsLib.version + ' 已就绪');
</script>
</body>
</html>
