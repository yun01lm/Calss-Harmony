name: logic-tests

# 逻辑层与数据层是纯 TS、零平台依赖，所以**不需要鸿蒙 SDK** 就能在 CI 上跑全部断言。
# UI 层（.ets）依赖 DevEco SDK，CI 里不构建 —— 由本机 DevEco / 模拟器负责。
on:
  push:
  pull_request:
  workflow_dispatch:

# 只读令牌：这个工作流只需要读仓库
permissions:
  contents: read

jobs:
  test:
    name: 断言 + 架构守卫
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 24（原生支持 .ts 与 node:sqlite）
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 跑测试
        run: node --test "tests/*.test.ts"

      # 守卫用脚本而不是 grep：grep 只能看单行，多行 import / `export * from` / `../` 跨层
      # 全都漏（而这些正是本仓库的实际写法）。脚本还检查 logic/ 与 data/ 的依赖方向。
      - name: 架构守卫（零平台依赖 + import 带 .ts + 不跨层）
        run: node tools/check-architecture.mjs
